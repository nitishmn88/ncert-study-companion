                                <div>
                                    <h3 className="font-bold text-slate-900">{currentSubjectObj.name}</h3>
                                    <p className="text-xs text-slate-500">Showing {filteredChapters.length} chapters for {classData.name}</p>
                                </div>
                            </div>
                            <div className="relative w-full sm:w-80">
                                <Icon name="search" className="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" />
                                <input
                                    type="text"
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    placeholder="Search chapter title..."
                                    className="w-full bg-slate-50 border border-slate-200 rounded-xl pl-10 pr-4 py-2 text-xs sm:text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:border-blue-500 transition-colors"
                                />
                            </div>
                        </div>

                        <AdBanner slotName="In-Content Banner Ad (Responsive)" />

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-10">
                            {filteredChapters.length === 0 ? (
                                <div className="col-span-full bg-white rounded-2xl p-12 text-center border border-slate-200">
                                    <p className="text-sm font-medium text-slate-500">No chapters found matching "{searchQuery}".</p>
                                </div>
                            ) : (
                                filteredChapters.map((chapter) => (
                                    <div 
                                        key={chapter.id}
                                        className="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm hover:shadow-md transition-all flex flex-col justify-between group"
                                    >
                                        <div>
                                            <div className="flex items-center justify-between mb-3">
                                                <span className="text-xs font-bold uppercase tracking-wider px-2.5 py-1 rounded-full bg-blue-50 text-blue-700 border border-blue-100">
                                                    Chapter {chapter.number}
                                                </span>
                                                <span className="text-xs font-medium text-slate-400">{classData.name} • {currentSubjectObj.name}</span>
                                            </div>
                                            <h4 className="text-base font-bold text-slate-900 group-hover:text-blue-600 transition-colors mb-4">
                                                {chapter.title}
                                            </h4>
                                        </div>

                                        <div className="pt-4 border-t border-slate-100 flex items-center justify-between gap-2">
                                            <div className="flex items-center space-x-2">
                                                <button
                                                    onClick={() => openReader(chapter)}
                                                    className="px-3.5 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold shadow-sm transition-all flex items-center cursor-pointer"
                                                >
                                                    <Icon name="book-open" className="w-3.5 h-3.5 mr-1.5" />
                                                    Read Online
                                                </button>
                                                <button
                                                    onClick={(e) => handleDirectDownload(e, chapter.pdfUrl, chapter.title)}
                                                    className="p-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold transition-all flex items-center cursor-pointer"
                                                    title="Download PDF"
                                                >
                                                    <Icon name="download" className="w-4 h-4" />
                                                </button>
                                            </div>
                                            <a
                                                href={`https://gemini.google.com/app?prompt=${encodeURIComponent(`Context: NCERT ${classData.name} ${currentSubjectObj.name}, Chapter: "${chapter.title}". Please explain step-by-step with real-world examples and simple explanations.`)}`}
                                                target="_blank"
                                                rel="noopener noreferrer"
                                                className="text-xs font-semibold text-indigo-600 hover:text-indigo-800 flex items-center bg-indigo-50 hover:bg-indigo-100 px-3 py-2 rounded-xl transition-colors"
                                                title="Ask Gemini AI Tutor"
                                            >
                                                <Icon name="sparkles" className="w-3.5 h-3.5 mr-1 text-indigo-600" />
                                                Ask AI Tutor
                                            </a>
                                        </div>
                                    </div>
                                ))
                            )}
                        </div>

                        <GeminiLauncher 
                            gradeName={classData.name} 
                            subjectName={currentSubjectObj.name} 
                            chapterTitle={`${currentSubjectObj.name} (${classData.name} Full Syllabus)`} 
                        />
                    </div>

                    <PdfModal
                        isOpen={modalOpen}
                        onClose={() => setModalOpen(false)}
                        chapterTitle={activeChapter?.title}
                        pdfUrl={activeChapter?.pdfUrl}
                        gradeName={`${classData.name} - ${currentSubjectObj.name}`}
                    />
                </div>
            );
        };

        const DisclaimerPage = () => {
            return (
                <div className="flex-1 bg-slate-50 py-12">
                    <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="bg-white rounded-3xl p-8 sm:p-12 border border-slate-200 shadow-sm space-y-8">
                            <div>
                                <span className="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-amber-50 text-amber-700 border border-amber-200 mb-4">
                                    <Icon name="shield-check" className="w-3.5 h-3.5 mr-1.5" /> Legal & Compliance Notice
                                </span>
                                <h1 className="text-2xl sm:text-3xl font-extrabold text-slate-900 mb-2">Disclaimer & Copyright Policy</h1>
                                <p className="text-xs text-slate-500">Last updated: {new Date().toLocaleDateString()}</p>
                            </div>

                            <div className="space-y-6 text-sm text-slate-700 leading-relaxed">
                                <section className="space-y-3">
                                    <h2 className="text-lg font-bold text-slate-900">1. Educational Purpose & Non-Affiliation</h2>
                                    <p>
                                        NCERT Study Companion is an independent digital educational resource platform created solely to assist students and educators across India in accessing publicly available educational materials. We are <strong>not officially affiliated</strong>, associated, authorized, endorsed by, or in any way officially connected with the National Council of Educational Research and Training (NCERT) or any government entity.
                                    </p>
                                </section>

                                <section className="space-y-3">
                                    <h2 className="text-lg font-bold text-slate-900">2. Source of Materials & Fair Use</h2>
                                    <p>
                                        All textbooks, curriculum outlines, and PDF documents linked or embedded within this platform are sourced directly from the official public domain repositories of NCERT (<a href="https://ncert.nic.in" target="_blank" rel="noopener noreferrer" className="text-blue-600 underline">ncert.nic.in</a>). We do not host copyrighted PDF files on our proprietary servers; instead, we provide direct hyperlinks and secure viewing frames referencing official public URLs for educational convenience under educational fair use guidelines.
                                    </p>
                                </section>

                                <section className="space-y-3">
                                    <h2 className="text-lg font-bold text-slate-900">3. Google AdSense & Monetization</h2>
                                    <p>
                                        This website displays advertisements provided by Google AdSense to help maintain hosting costs and keep the platform 100% free for all students. Google, as a third-party vendor, uses cookies to serve ads based on users' prior visits to this website or other websites. Users may opt out of personalized advertising by visiting Google Ads Settings.
                                    </p>
                                </section>

                                <section className="space-y-3">
                                    <h2 className="text-lg font-bold text-slate-900">4. Privacy Policy</h2>
                                    <p>
                                        We respect user privacy. We do not collect personally identifiable information (PII) unless voluntarily provided (such as browser queries). Standard anonymous analytics and cookies may be utilized by third-party advertising partners in accordance with standard web policies.
                                    </p>
                                </section>
                            </div>

                            <div className="pt-6 border-t border-slate-200 flex justify-end">
                                <a href="https://ncert.nic.in" target="_blank" rel="noopener noreferrer" className="px-5 py-2.5 rounded-xl bg-slate-900 text-white text-xs font-semibold hover:bg-slate-800 transition-colors">
                                    Visit Official NCERT Website
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [currentView, setCurrentView] = useState('home');
            const [selectedClass, setSelectedClass] = useState('class-11');

            useEffect(() => {
                window.scrollTo(0, 0);
            }, [currentView, selectedClass]);

            return (
                <div className="min-h-screen flex flex-col bg-slate-50">
                    <Navbar 
                        currentView={currentView} 
                        setCurrentView={setCurrentView} 
                        selectedClass={selectedClass} 
                        setSelectedClass={setSelectedClass} 
                    />

                    {currentView === 'home' && (
                        <HomePage setSelectedClass={setSelectedClass} setCurrentView={setCurrentView} />
                    )}

                    {currentView === 'class' && (
                        <ClassView selectedClass={selectedClass} setSelectedClass={setSelectedClass} />
                    )}

                    {currentView === 'computer' && (
                        <ComputerPage />
                    )}

                    {currentView === 'disclaimer' && (
                        <DisclaimerPage />
                    )}

                    <Footer setCurrentView={setCurrentView} />
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
