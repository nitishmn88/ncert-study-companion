                                            <p className="font-semibold text-slate-800">On the basis of data handling:</p>
                                            <ul className="list-disc pl-5 space-y-1 mb-3">
                                                <li><strong>Analog Computer:</strong> Operates on continuous data with no discrete values[span_28](start_span)[span_28](end_span) (e.g., Mercury thermometer, Speedometer)[span_29](start_span)[span_29](end_span).</li>
                                                <li><strong>Digital Computer:</strong> Accepts raw input in binary 0 and 1 format[span_30](start_span)[span_30](end_span) (e.g., Laptops, Desktops, Smartphones)[span_31](start_span)[span_31](end_span).</li>
                                                <li><strong>Hybrid Computer:</strong> Combines features of both analog and digital systems to process continuous and discrete data[span_32](start_span)[span_32](end_span) (e.g., Petrol pump processors calculating quantity & price)[span_33](start_span)[span_33](end_span).</li>
                                            </ul>

                                                <li><strong>Workstation:</strong> Dedicated single-user machine with advanced graphics and processing for engineering, CAD/CAM, and software development[span_36](start_span)[span_36](end_span).</li>
                                                <li><strong>Mini Computer:</strong> Mid-size multi-user system, 5 to 50 times more processing power than microcomputers[span_37](start_span)[span_37](end_span).</li>
                                                <li><strong>Mainframe Computer:</strong> Enterprise systems allowing 100+ concurrent users via time-sharing and multitasking[span_38](start_span)[span_38](end_span).</li>
                                                <li><strong>Super Computer:</strong> Fastest and most expensive computers handling complex mathematical modeling[span_39](start_span)[span_39](end_span). First supercomputer developed in 1976 by Roger Cray.</li>
                                                <li><strong>Quantum Computer:</strong> Operates on Q-Bits instead of standard binary bits[span_40](start_span)[span_40](end_span).</li>
